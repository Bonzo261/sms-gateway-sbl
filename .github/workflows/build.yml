name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.14.3"

      - name: Build APK
        run: |
          gradle assembleRelease --no-daemon
          mv app/build/outputs/apk/release/app-release.apk SmsGateway-build${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v5
        with:
          name: SmsGateway-apk
          path: SmsGateway-build*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: SMS Gateway build ${{ github.run_number }}
          body: "Automatische build van ${{ github.sha }}. Download het .apk-bestand hieronder en installeer het op je telefoon."
          files: SmsGateway-build*.apk
          make_latest: true
